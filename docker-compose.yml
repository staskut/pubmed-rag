services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pubmed_rag_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pubmed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pubmed}
      POSTGRES_DB: ${POSTGRES_DB:-pubmed}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pubmed} -d ${POSTGRES_DB:-pubmed}"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: pubmed_rag_grafana
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # anonymous viewing so reviewers can open the dashboard without a login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      # passed through so the datasource provisioning file can interpolate them
      POSTGRES_USER: ${POSTGRES_USER:-pubmed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pubmed}
      POSTGRES_DB: ${POSTGRES_DB:-pubmed}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  pgdata:
  grafana_data:
