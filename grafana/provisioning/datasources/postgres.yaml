apiVersion: 1

# Grafana interpolates ${VAR} from its own container environment (the bash
# ":-default" form is NOT supported here), so POSTGRES_* are passed into the
# grafana service in docker-compose.yml.
datasources:
  - name: PubMedRAG
    uid: pubmedrag_pg
    type: postgres
    access: proxy
    url: db:5432                 # service name on the compose network (not host 5433)
    user: ${POSTGRES_USER}
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
