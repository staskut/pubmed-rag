[project]
name = "pubmed-rag"
version = "0.1.0"
description = "Anesthesiology PubMed Q&A — RAG capstone project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32,<3",
    "lxml>=5.3,<6",
    "tenacity>=9.0,<10",
    "python-dotenv>=1.0,<2",
    "tqdm>=4.67,<5",
    "dlt[duckdb,postgres]>=1.5,<2",
    "tiktoken>=0.8,<1",
    "openai>=1.60,<2",
    "pgvector>=0.3,<0.5",
    "streamlit>=1.40,<2",
    "fastembed>=0.4,<0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pubmed_rag"]
